<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis</title><style>body{background:#0d1420;color:#eaf3f1;font:15px system-ui;margin:0}header{padding:20px;background:#172333;font-weight:800;letter-spacing:4px}main{max-width:750px;margin:auto;padding:14px}.stats,.actions,.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.box{background:#1c2a3b;border-radius:12px;padding:12px;margin:8px 0}button{background:#284459;border:1px solid #517084;color:white;border-radius:9px;padding:13px;font-weight:600}button:disabled{opacity:.35}svg{width:100%;border-radius:12px;background:#59855c}small{color:#9eb5c6}.log{font-size:12px;max-height:140px;overflow:auto}</style></head><body><header>GENESIS <small>V0.1</small></header><main><div class="stats" id="stats"></div><svg viewBox="0 0 600 360" id="map"><path d="M295 0 Q250 95 315 175 T300 360" stroke="#6eb3cb" stroke-width="67" fill="none"/><path d="M0 160H600 M100 0V360 M465 0V360" stroke="#c4b8a0" stroke-width="16" fill="none"/><g id="buildings"></g></svg><div class="actions"><button onclick="advance(1)">▶ 1 Year</button><button onclick="advance(10)">⏩ 10 Years</button><button id="bridge" onclick="choose('bridge')">🌉 Build Bridge</button><button id="factory" onclick="choose('factory')">🏭 Open Factory</button><button id="park" onclick="choose('park')">🌳 Create Park</button><button id="tax" onclick="choose('tax')">💰 Lower Taxes</button><button onclick="branch()">⑂ Branch History</button><button onclick="reset()">↺ Restart</button></div><div class="box"><b>HISTORY EXPLORER</b><div id="branches"></div><p><small>Branch at any point, make different choices, then switch histories to compare outcomes.</small></p><div class="compare" id="compare"></div></div><div class="box"><b>WORLD EVENTS</b><div id="log" class="log"></div></div><small>Early prototype: population, jobs and prosperity are calculated with simplified rules. This is not yet a full character simulation.</small></main><script>
let worlds=[],current=0,n=1;
function initial(){return{name:'Original',year:2026,pop:100,jobs:62,prosperity:50,bridge:false,factory:false,park:false,tax:false,seed:27,events:['2026: The town is founded.']}}
worlds=[initial()];
function random(w){w.seed=(Math.imul(w.seed,1664525)+1013904223)>>>0;return w.seed/4294967296}
function event(w,msg){w.events.unshift(w.year+': '+msg);w.events=w.events.slice(0,30)}
function tick(w){w.year++;let r=random(w);w.pop+=Math.max(-2,1+(w.bridge?3:0)+(w.factory?2:0)+(w.park?1:0)+(w.tax?1:0)+(r>.8?2:r<.2?-2:0));w.jobs+=1+(w.bridge?2:0)+(w.factory?5:0)+(w.tax?1:0);w.prosperity=Math.max(5,Math.min(99,w.prosperity+(w.jobs/w.pop>.65?2:-1)+(w.park?1:0)+(w.tax?1:0)-(w.factory?1:0)));if(w.year%3===0)event(w,w.pop+' residents and '+w.jobs+' jobs.')}
function advance(years){let w=worlds[current];for(let i=0;i<years;i++)tick(w);render()}
function choose(k){let w=worlds[current];if(w[k])return;w[k]=true;event(w,{bridge:'A bridge crosses the river.',factory:'A factory opens.',park:'A new public park opens.',tax:'Business taxes fall.'}[k]);render()}
function branch(){let w=JSON.parse(JSON.stringify(worlds[current]));w.name='Timeline '+n++;event(w,'History branches.');worlds.push(w);current=worlds.length-1;render()}
function reset(){if(confirm('Restart all timelines?')){worlds=[initial()];current=0;n=1;render()}}
function switchWorld(i){current=i;render()}
function render(){let w=worlds[current];document.getElementById('stats').innerHTML=[['YEAR',w.year],['RESIDENTS',w.pop],['JOBS',w.jobs],['PROSPERITY',w.prosperity+'/100']].map(([a,b])=>'<div class="box"><small>'+a+'</small><h2>'+b+'</h2></div>').join('');let houses='';for(let i=0;i<Math.min(48,Math.floor(w.pop/7));i++){let east=w.bridge&&i%3===0,x=east?350+(i%6)*35:15+(i%6)*35,y=25+Math.floor(i/6)*38;houses+='<rect x="'+x+'" y="'+y+'" width="22" height="17" rx="2" fill="'+(i%2?'#ebc7a0':'#d7ddd1')+'" stroke="#685f57"/>'}if(w.bridge)houses+='<rect x="260" y="147" width="83" height="26" fill="#d6c6a6"/>';if(w.factory)houses+='<rect x="495" y="235" width="70" height="50" fill="#a8aeb4"/>';if(w.park)houses+='<rect x="380" y="270" width="60" height="55" rx="12" fill="#245e37"/>';document.getElementById('buildings').innerHTML=houses;['bridge','factory','park','tax'].forEach(k=>document.getElementById(k).disabled=w[k]);document.getElementById('branches').innerHTML=worlds.map((v,i)=>'<button onclick="switchWorld('+i+')" style="margin:6px 4px 0 0;'+(i===current?'background:#407a68':'')+'">'+v.name+' · '+v.year+'</button>').join('');document.getElementById('compare').innerHTML=worlds.map(v=>'<div class="box"><small>'+v.name+'</small><p>'+v.pop+' residents<br>'+v.jobs+' jobs<br>Prosperity '+v.prosperity+'</p></div>').join('');document.getElementById('log').innerHTML=w.events.map(e=>'<p>'+e+'</p>').join('')}
render();</script></body></html>
